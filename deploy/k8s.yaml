# Advanced110AlarmSystem k3s 首装清单（遵循 cicd/runbook-onboard-new-java-app.md 规范）
# - 命名空间：alarm110；镜像：私有仓库 alarm110/alarm-server，tag 由发布流程写入（非 latest）
# - 中间件全部复用 middleware 命名空间现网服务：mysql / redis / kafka（服务 DNS 见 env）
# - 数据库与凭据在首装时于集群侧创建并注入（alarm-mysql-secret / middleware-redis / galaxy-registry），密码不进 git
# - 对外暴露：NodePort 30085
---
apiVersion: v1
kind: Namespace
metadata:
  name: alarm110
---
# Seata 事务协调器（TC）：单节点 file 存储/registry，事务组映射由客户端 file.conf 决定
apiVersion: v1
kind: ConfigMap
metadata:
  name: seata-server-config
  namespace: alarm110
data:
  application.yml: |
    spring:
      application:
        name: seata-server
    seata:
      config:
        type: file
      registry:
        type: file
      store:
        mode: file
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seata-server
  namespace: alarm110
  labels:
    app: seata-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: seata-server
  template:
    metadata:
      labels:
        app: seata-server
    spec:
      containers:
        - name: seata-server
          image: apache/seata-server:2.2.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8091
            - containerPort: 7091
          volumeMounts:
            - name: config
              mountPath: /seata-server/resources/application.yml
              subPath: application.yml
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 1Gi
      volumes:
        - name: config
          configMap:
            name: seata-server-config
---
apiVersion: v1
kind: Service
metadata:
  name: seata-server
  namespace: alarm110
spec:
  selector:
    app: seata-server
  ports:
    - name: rpc
      port: 8091
      targetPort: 8091
    - name: console
      port: 7091
      targetPort: 7091
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alarm-server
  namespace: alarm110
  labels:
    app: alarm-server
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: alarm-server
  template:
    metadata:
      labels:
        app: alarm-server
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: alarm-server
          image: registry.galaxy.local:30500/alarm110/alarm-server:git-b332c9e
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: TZ
              value: Asia/Shanghai
            - name: SPRING_PROFILES_ACTIVE
              value: k8s,sharding
            - name: ALARM_SEATA_ENABLED
              value: "true"
            - name: SPRING_DATASOURCE_URL
              value: jdbc:mysql://mysql.middleware.svc.cluster.local:3306/alarm110?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=utf8&connectionTimeZone=Asia/Shanghai
            - name: SPRING_DATASOURCE_USERNAME
              value: alarm110
            - name: ALARM_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: alarm-mysql-secret
                  key: datasource-password
            - name: ALARM_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: middleware-redis
                  key: redis-password
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: kafka.middleware.svc.cluster.local:9092
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 10
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
          resources:
            requests:
              cpu: 200m
              memory: 768Mi
            limits:
              memory: 1536Mi
      imagePullSecrets:
        - name: galaxy-registry
---
apiVersion: v1
kind: Service
metadata:
  name: alarm-server
  namespace: alarm110
spec:
  type: NodePort
  selector:
    app: alarm-server
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30085
---
# 前端：Vue3 + Vite 产物，nginx 静态托管并把 /api/ 反代到 alarm-server（集群内 DNS 直连，无需 NodePort 硬编码）
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alarm-web
  namespace: alarm110
  labels:
    app: alarm-web
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: alarm-web
  template:
    metadata:
      labels:
        app: alarm-web
    spec:
      terminationGracePeriodSeconds: 20
      containers:
        - name: alarm-web
          image: registry.galaxy.local:30500/alarm110/alarm-web:git-b4b4d69
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /index.html
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /index.html
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
      imagePullSecrets:
        - name: galaxy-registry
---
apiVersion: v1
kind: Service
metadata:
  name: alarm-web
  namespace: alarm110
spec:
  type: NodePort
  selector:
    app: alarm-web
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30086
